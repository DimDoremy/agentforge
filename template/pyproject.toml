[project]
name = "agentforge-template"
version = "0.1.0"
description = "agentforge — runnable skeleton for workflow-level AI agents (FastAPI + LangGraph + DeepAgents, single Postgres)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "agentforge contributors" }]

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # langchain / langgraph / deepagents
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",      # default embeddings/chat provider; swap as needed
    "langchain-postgres>=0.0.12", # PGVector (pgvector)
    "langgraph>=0.2.70",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-cli[inmem]>=0.1.70",  # provides `langgraph dev`
    "deepagents>=0.1",
    # postgres platform layer
    "psycopg[binary]>=3.2",
    "tembo-pgmq-python>=0.8",  # PGMQ Postgres-extension Python client (PGMQueue class)
    # config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # tooling helpers
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "langchain-community>=0.3",   # GenericFakeChatModel for agent smoke tests
]

[project.scripts]
agentforge = "agentforge_template.app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_template"]

# --- uv ---------------------------------------------------------------------
[tool.uv]
package = true

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # formatter owns line length

[tool.ruff.format]
quote-style = "double"

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
